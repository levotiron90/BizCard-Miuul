<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sercan BALLI | Dijital Kartvizit</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #eef2f7 0%, #dbe6f0 100%);
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(13, 27, 52, 0.18);
  }

  .header-bar {
    padding: 32px 32px 28px;
    background: #0d1b34;
    text-align: center;
  }

  .card-body {
    padding: 28px 32px 24px;
    text-align: center;
  }

  .company-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.6);
  }

  .name {
    margin-top: 6px;
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
  }

  .title {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: #4fd4e0;
  }

  .divider {
    height: 1px;
    background: #e6ebf0;
    margin: 24px 0;
  }

  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #33404f;
    text-decoration: none;
    font-size: 14.5px;
  }

  .contact-item:hover {
    color: #1fb6c9;
  }

  .icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #e6f7f8;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg {
    width: 18px;
    height: 18px;
    stroke: #1fb6c9;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 26px;
  }

  .social-link {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #e6f7f8;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .social-link:hover {
    background: #1fb6c9;
    transform: translateY(-2px);
  }

  .social-link svg {
    width: 18px;
    height: 18px;
    fill: #1fb6c9;
  }

  .social-link:hover svg {
    fill: #ffffff;
  }

  .save-form {
    text-align: left;
  }

  .consent-field {
    margin-top: 4px;
  }

  .consent-label {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
  }

  .consent-checkbox {
    margin-top: 3px;
    flex-shrink: 0;
  }

  .consent-label span {
    font-size: 13px;
    line-height: 1.5;
    color: #33404f;
  }

  .consent-link {
    padding: 0;
    border: none;
    background: none;
    font: inherit;
    font-weight: 600;
    color: #1fb6c9;
    text-decoration: underline;
    cursor: pointer;
  }

  .policy-overlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 27, 52, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }

  .policy-modal {
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    background: #ffffff;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .policy-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    background: #0d1b34;
  }

  .policy-title {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
  }

  .policy-close {
    border: none;
    background: none;
    color: #ffffff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }

  .policy-body {
    padding: 20px;
    overflow-y: auto;
  }

  .policy-section {
    margin-bottom: 16px;
  }

  .policy-heading {
    font-size: 13.5px;
    font-weight: 700;
    color: #0d1b34;
    margin-bottom: 6px;
  }

  .policy-paragraph {
    font-size: 13px;
    line-height: 1.5;
    color: #5a6b7a;
    margin-bottom: 6px;
  }

  .form-field {
    margin-bottom: 14px;
  }

  .form-label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #33404f;
  }

  .form-input {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid #dde5ea;
    border-radius: 10px;
    background: #f5f8f9;
    color: #0d1b34;
  }

  .form-input:focus {
    outline: none;
    border-color: #1fb6c9;
  }

  .form-input-error {
    border-color: #e5484d;
  }

  .form-error {
    margin-top: 6px;
    font-size: 12px;
    color: #e5484d;
  }

  .form-buttons {
    display: flex;
    gap: 10px;
  }

  .form-button {
    flex: 1;
    padding: 12px 8px;
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    line-height: 1.3;
    color: #ffffff;
    background: linear-gradient(135deg, #0d1b34, #1fb6c9);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  .form-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .form-status {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
  }

  .form-status-success {
    color: #1f9d55;
  }

  .form-status-error {
    color: #e5484d;
  }

  .form-status-info {
    color: #b45309;
  }

  .save-phone-section {
    text-align: center;
  }

  .save-phone-title {
    font-size: 15px;
    font-weight: 700;
    color: #0d1b34;
  }

  .save-phone-desc {
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.4;
    color: #5a6b7a;
  }

  .save-phone-button {
    display: inline-block;
    margin-top: 14px;
    padding: 10px 28px;
    border: 2px solid #1fb6c9;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: #1fb6c9;
    background: #ffffff;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .save-phone-button:hover {
    background: #1fb6c9;
    color: #ffffff;
  }

  .qr-section {
    text-align: center;
  }

  .qr-caption {
    margin-top: 12px;
    font-size: 13px;
    font-weight: 600;
    color: #1fb6c9;
  }

  .qr-domain {
    margin-top: 4px;
    font-size: 12px;
    color: #8a94a6;
  }

  .footer-bar {
    padding: 14px;
    background: #0d1b34;
    text-align: center;
  }

  .footer-bar a {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #ffffff;
    text-decoration: none;
  }

  @media (max-width: 400px) {
    .header-bar {
      padding: 26px 22px 22px;
    }

    .card-body {
      padding: 28px 22px 20px;
    }
  }
</style>
</head>
<body>

  <div id="root"></div>

  <script type="importmap">
  {
    "imports": {
      "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18.2.0/jsx-dev-runtime"
    }
  }
  </script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <script src="src/data/person.js"></script>
  <script src="src/data/privacy.js"></script>
  <script src="src/data/site.js"></script>
  <script src="src/data/webhooks.js"></script>

  <script type="text/babel" data-type="module" data-presets="react" src="card.js"></script>

</body>
</html>
