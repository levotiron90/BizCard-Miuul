<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sercan BALLI | Dijital Kartvizit</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #eef2f7 0%, #dbe6f0 100%);
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(13, 27, 52, 0.18);
  }

  .header-bar {
    padding: 32px 32px 28px;
    background: #0d1b34;
    text-align: center;
  }

  .card-body {
    padding: 28px 32px 24px;
    text-align: center;
  }

  .company-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.6);
  }

  .name {
    margin-top: 6px;
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
  }

  .title {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: #4fd4e0;
  }

  .divider {
    height: 1px;
    background: #e6ebf0;
    margin: 24px 0;
  }

  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #33404f;
    text-decoration: none;
    font-size: 14.5px;
  }

  .contact-item:hover {
    color: #1fb6c9;
  }

  .icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #e6f7f8;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg {
    width: 18px;
    height: 18px;
    stroke: #1fb6c9;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 26px;
  }

  .social-link {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #e6f7f8;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .social-link:hover {
    background: #1fb6c9;
    transform: translateY(-2px);
  }

  .social-link svg {
    width: 18px;
    height: 18px;
    fill: #1fb6c9;
  }

  .social-link:hover svg {
    fill: #ffffff;
  }

  .save-form {
    text-align: left;
  }

  .consent-field {
    margin-top: 4px;
  }

  .consent-label {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
  }

  .consent-checkbox {
    margin-top: 3px;
    flex-shrink: 0;
  }

  .consent-label span {
    font-size: 13px;
    line-height: 1.5;
    color: #33404f;
  }

  .consent-link {
    padding: 0;
    border: none;
    background: none;
    font: inherit;
    font-weight: 600;
    color: #1fb6c9;
    text-decoration: underline;
    cursor: pointer;
  }

  .policy-overlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 27, 52, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }

  .policy-modal {
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    background: #ffffff;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .policy-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    background: #0d1b34;
  }

  .policy-title {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
  }

  .policy-close {
    border: none;
    background: none;
    color: #ffffff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }

  .policy-body {
    padding: 20px;
    overflow-y: auto;
  }

  .policy-section {
    margin-bottom: 16px;
  }

  .policy-heading {
    font-size: 13.5px;
    font-weight: 700;
    color: #0d1b34;
    margin-bottom: 6px;
  }

  .policy-paragraph {
    font-size: 13px;
    line-height: 1.5;
    color: #5a6b7a;
    margin-bottom: 6px;
  }

  .form-field {
    margin-bottom: 14px;
  }

  .form-label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #33404f;
  }

  .form-input {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid #dde5ea;
    border-radius: 10px;
    background: #f5f8f9;
    color: #0d1b34;
  }

  .form-input:focus {
    outline: none;
    border-color: #1fb6c9;
  }

  .form-input-error {
    border-color: #e5484d;
  }

  .form-error {
    margin-top: 6px;
    font-size: 12px;
    color: #e5484d;
  }

  .form-buttons {
    display: flex;
    gap: 10px;
  }

  .form-button {
    flex: 1;
    padding: 12px 8px;
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    line-height: 1.3;
    color: #ffffff;
    background: linear-gradient(135deg, #0d1b34, #1fb6c9);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  .form-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .form-status {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
  }

  .form-status-success {
    color: #1f9d55;
  }

  /* ---- Sohbet penceresi ---- */
  .chat-fab { position: fixed; right: 1.25rem; bottom: 1.25rem; width: 3.25rem; height: 3.25rem; border-radius: 999px; border: none; background: linear-gradient(135deg, #0d1b34, #1fb6c9); color: #fff; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 24px -8px rgba(13, 27, 52, 0.5); z-index: 60; }
  .chat-panel { position: fixed; right: 1.25rem; bottom: 5rem; width: min(360px, calc(100vw - 2.5rem)); height: min(520px, calc(100vh - 7rem)); background: #ffffff; border: 1px solid #dde5ea; border-radius: 18px; box-shadow: 0 20px 44px -16px rgba(13, 27, 52, 0.45); display: flex; flex-direction: column; overflow: hidden; z-index: 60; }
  .chat-panel-header { background: linear-gradient(135deg, #0d1b34, #1fb6c9); color: #fff; padding: 0.9rem 1.1rem; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .chat-panel-header strong { font-size: 1rem; }
  .chat-panel-header span { display: block; font-size: 0.72rem; opacity: 0.85; }
  .chat-close-btn { border: none; background: transparent; color: #fff; font-size: 1.1rem; cursor: pointer; padding: 0.2rem 0.3rem; }
  .chat-messages { flex: 1 1 auto; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .chat-msg { max-width: 85%; padding: 0.6rem 0.85rem; border-radius: 14px; font-size: 0.87rem; line-height: 1.45; white-space: pre-wrap; color: #0d1b34; }
  .chat-msg.user { align-self: flex-end; background: #d9f3f7; border-bottom-right-radius: 4px; }
  .chat-msg.bot { align-self: flex-start; background: #eef2f4; border-bottom-left-radius: 4px; }
  .chat-msg.error { align-self: flex-start; background: #fde8e8; color: #7f1d1d; }
  .chat-typing { align-self: flex-start; display: flex; gap: 0.25rem; padding: 0.6rem 0.85rem; }
  .chat-typing span { width: 6px; height: 6px; border-radius: 999px; background: #8a94a6; animation: chat-typing-bounce 1.1s infinite ease-in-out; }
  .chat-typing span:nth-child(2) { animation-delay: 0.15s; }
  .chat-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes chat-typing-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-3px); opacity: 1; } }
  .chat-input-row { flex-shrink: 0; display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid #dde5ea; background: #ffffff; }
  .chat-input-row input { flex: 1 1 auto; min-width: 0; font-family: inherit; font-size: 0.87rem; color: #0d1b34; background: #f5f8f9; border: 1px solid #dde5ea; border-radius: 999px; padding: 0.55rem 0.9rem; }
  .chat-input-row input:focus { outline: 2px solid #1fb6c9; outline-offset: 1px; }
  .chat-send-btn { flex-shrink: 0; border: none; background: #1fb6c9; color: #fff; width: 2.4rem; height: 2.4rem; border-radius: 999px; cursor: pointer; }
  .chat-send-btn:disabled { opacity: 0.5; cursor: default; }

  .form-status-error {
    color: #e5484d;
  }

  .form-status-info {
    color: #b45309;
  }

  .save-phone-section {
    text-align: center;
  }

  .save-phone-title {
    font-size: 15px;
    font-weight: 700;
    color: #0d1b34;
  }

  .save-phone-desc {
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.4;
    color: #5a6b7a;
  }

  .save-phone-button {
    display: inline-block;
    margin-top: 14px;
    padding: 10px 28px;
    border: 2px solid #1fb6c9;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: #1fb6c9;
    background: #ffffff;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .save-phone-button:hover {
    background: #1fb6c9;
    color: #ffffff;
  }

  .qr-section {
    text-align: center;
  }

  .qr-caption {
    margin-top: 12px;
    font-size: 13px;
    font-weight: 600;
    color: #1fb6c9;
  }

  .qr-domain {
    margin-top: 4px;
    font-size: 12px;
    color: #8a94a6;
  }

  .footer-bar {
    padding: 14px;
    background: #0d1b34;
    text-align: center;
  }

  .footer-bar a {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #ffffff;
    text-decoration: none;
  }

  @media (max-width: 400px) {
    .header-bar {
      padding: 26px 22px 22px;
    }

    .card-body {
      padding: 28px 22px 20px;
    }
  }
</style>
</head>
<body>

  <div id="root"></div>

  <script type="importmap">
  {
    "imports": {
      "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18.2.0/jsx-dev-runtime"
    }
  }
  </script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <script src="src/data/person.js"></script>
  <script src="src/data/privacy.js"></script>
  <script src="src/data/site.js"></script>
  <script src="src/data/webhooks.js"></script>

  <script type="text/babel" data-type="module" data-presets="react" src="card.js"></script>

</body>
</html>
