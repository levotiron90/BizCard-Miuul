<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sercan BALLI | Dijital Kartvizit</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #6a5cff 0%, #8a6bff 45%, #5eb8ff 100%);
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(30, 20, 90, 0.25);
  }

  .avatar {
    width: 92px;
    height: 92px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6a5cff, #5eb8ff);
    color: #ffffff;
    font-size: 34px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .name {
    font-size: 22px;
    font-weight: 700;
    color: #1f1b3d;
  }

  .title {
    margin-top: 4px;
    font-size: 15px;
    color: #6a5cff;
    font-weight: 600;
  }

  .company {
    margin-top: 4px;
    font-size: 13px;
    color: #8a86a3;
  }

  .divider {
    height: 1px;
    background: #eceaf6;
    margin: 24px 0;
  }

  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #3a3560;
    text-decoration: none;
    font-size: 14.5px;
  }

  .contact-item:hover {
    color: #6a5cff;
  }

  .icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #f3f1ff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg {
    width: 18px;
    height: 18px;
    stroke: #6a5cff;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 26px;
  }

  .social-link {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f3f1ff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .social-link:hover {
    background: #6a5cff;
    transform: translateY(-2px);
  }

  .social-link svg {
    width: 18px;
    height: 18px;
    fill: #6a5cff;
  }

  .social-link:hover svg {
    fill: #ffffff;
  }

  @media (max-width: 400px) {
    .card {
      padding: 32px 22px;
    }
  }
</style>
</head>
<body>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <script type="text/babel">
    const { useState } = React;

    const PhoneIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
      </svg>
    );

    const MailIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 4h16v16H4z" />
        <path d="m4 6 8 7 8-7" />
      </svg>
    );

    const BuildingIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 21h18" />
        <path d="M6 21V7l6-4 6 4v14" />
        <path d="M10 21v-6h4v6" />
        <path d="M9 9h.01M15 9h.01M9 13h.01M15 13h.01" />
      </svg>
    );

    const LinkedinIcon = () => (
      <svg viewBox="0 0 24 24">
        <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z" />
      </svg>
    );

    const GithubIcon = () => (
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.58 2 12.19c0 4.49 2.87 8.3 6.84 9.64.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.72-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.89 1.55 2.34 1.1 2.91.84.09-.66.35-1.1.63-1.35-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05a9.36 9.36 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.8-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.19C22 6.58 17.52 2 12 2z" />
      </svg>
    );

    function Avatar({ initials }) {
      return <div className="avatar">{initials}</div>;
    }

    function ContactList({ items }) {
      return (
        <div className="contact-list">
          {items.map((item) => (
            <a key={item.href} className="contact-item" href={item.href}>
              <span className="icon">{item.icon}</span>
              <span>{item.label}</span>
            </a>
          ))}
        </div>
      );
    }

    function ProfileCard({ person }) {
      const contactItems = [
        { href: person.phoneHref, icon: <PhoneIcon />, label: person.phone },
        { href: person.emailHref, icon: <MailIcon />, label: person.email },
        { href: person.companyEmailHref, icon: <BuildingIcon />, label: person.companyLabel },
      ];

      return (
        <div className="card">
          <Avatar initials={person.initials} />
          <div className="name">{person.name}</div>
          <div className="title">{person.title}</div>
          <div className="company">{person.company}</div>

          <div className="divider"></div>

          <ContactList items={contactItems} />

          <div className="socials">
            <a className="social-link" href={person.linkedin} target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
              <LinkedinIcon />
            </a>
            <a className="social-link" href={person.github} target="_blank" rel="noopener noreferrer" aria-label="GitHub">
              <GithubIcon />
            </a>
          </div>
        </div>
      );
    }

    function App() {
      const [person] = useState({
        initials: "SB",
        name: "Sercan BALLI",
        title: "Industrial Digitalization & Analytics Engineer",
        company: "Veri Endüstri Mühendislik A.Ş.",
        phone: "+90 500 123 45 67",
        phoneHref: "tel:+905001234567",
        email: "sercan.balli@veriendustri.com",
        emailHref: "mailto:sercan.balli@veriendustri.com",
        companyLabel: "https://www.veriendustri.com/",
        companyEmailHref: "mailto:info@ornekdanismanlik.com",
        linkedin: "https://www.linkedin.com/in/sercan-sefa-balli-b0aa45a4/?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3BBYlDM6WnS3Co%2Fo3JJ29pRg%3D%3D",
        github: "https://github.com/levotiron90",
      });

      return <ProfileCard person={person} />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

</body>
</html>
