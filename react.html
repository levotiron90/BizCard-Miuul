<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sercan BALLI | Dijital Kartvizit</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #6a5cff 0%, #8a6bff 45%, #5eb8ff 100%);
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(30, 20, 90, 0.25);
  }

  .qr-block {
    margin-top: 16px;
    width: 100%;
    max-width: 360px;
    background: #ffffff;
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(30, 20, 90, 0.25);
  }

  .qr-caption {
    margin-top: 12px;
    font-size: 13px;
    color: #6a5cff;
    font-weight: 600;
  }

  .save-form {
    text-align: left;
  }

  .form-field {
    margin-bottom: 14px;
  }

  .form-label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #3a3560;
  }

  .form-input {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid #eceaf6;
    border-radius: 10px;
    background: #f9f9fd;
    color: #1f1b3d;
  }

  .form-input:focus {
    outline: none;
    border-color: #6a5cff;
  }

  .form-input-error {
    border-color: #e5484d;
  }

  .form-error {
    margin-top: 6px;
    font-size: 12px;
    color: #e5484d;
  }

  .form-buttons {
    display: flex;
    gap: 10px;
  }

  .form-button {
    flex: 1;
    padding: 12px 8px;
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    line-height: 1.3;
    color: #ffffff;
    background: linear-gradient(135deg, #6a5cff, #5eb8ff);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  .form-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .form-status {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
  }

  .form-status-success {
    color: #1f9d55;
  }

  .form-status-info {
    color: #b45309;
  }

  .avatar {
    width: 92px;
    height: 92px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6a5cff, #5eb8ff);
    color: #ffffff;
    font-size: 34px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .name {
    font-size: 22px;
    font-weight: 700;
    color: #1f1b3d;
  }

  .title {
    margin-top: 4px;
    font-size: 15px;
    color: #6a5cff;
    font-weight: 600;
  }

  .company {
    margin-top: 4px;
    font-size: 13px;
    color: #8a86a3;
  }

  .divider {
    height: 1px;
    background: #eceaf6;
    margin: 24px 0;
  }

  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #3a3560;
    text-decoration: none;
    font-size: 14.5px;
  }

  .contact-item:hover {
    color: #6a5cff;
  }

  .icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #f3f1ff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg {
    width: 18px;
    height: 18px;
    stroke: #6a5cff;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 26px;
  }

  .social-link {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f3f1ff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .social-link:hover {
    background: #6a5cff;
    transform: translateY(-2px);
  }

  .social-link svg {
    width: 18px;
    height: 18px;
    fill: #6a5cff;
  }

  .social-link:hover svg {
    fill: #ffffff;
  }

  @media (max-width: 400px) {
    .card {
      padding: 32px 22px;
    }
  }
</style>
</head>
<body>

  <div id="root"></div>

  <script type="importmap">
  {
    "imports": {
      "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18.2.0/jsx-dev-runtime"
    }
  }
  </script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <script src="src/data/person.js"></script>
  <script src="src/data/site.js"></script>
  <script src="src/data/webhooks.js"></script>

  <script type="text/babel" data-type="module" data-presets="react" src="card.js"></script>

</body>
</html>
